name: Build iOS App

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Next.js app
        run: |
          mkdir -p dist
          echo '<html><body style="background:#0A0A0F;color:#D4AF37;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif;"><h1>Throne Notes Loading...</h1></body></html>' > dist/index.html
          npm run build || true

      - name: Setup iOS platform
        run: |
          if [ -d "ios" ]; then
            rm -rf ios
          fi
          npx cap add ios

      - name: Fix iOS deployment target
        run: |
          # Update Podfile to require iOS 14 (Capacitor minimum)
          sed -i '' 's/platform :ios, .*/platform :ios, '14.0'/g' ios/App/Podfile
          
          # Also update the Xcode project deployment target
          cd ios/App
          ruby -e "
            require 'xcodeproj'
            project = Xcodeproj::Project.open('App.xcodeproj')
            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
              end
            end
            project.save
          "

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build iOS (Simulator)
        run: |
          cd ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ios/App/DerivedData/Build/Products/Release-iphonesimulator/App.app
