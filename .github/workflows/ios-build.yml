name: Build iOS App

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: |
          mkdir -p dist
          echo '<html><body style="background:#0A0A0F;color:#D4AF37;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif;"><h1>Throne Notes Loading...</h1></body></html>' > dist/index.html
          npm run build || true

      - name: Add iOS platform
        run: |
          rm -rf ios
          npx cap add ios

      - name: Fix iOS deployment target in Podfile
        run: |
          # Capacitor requires iOS 14+. Fix the Podfile before pod install.
          perl -i -pe "s/platform :ios, '.*'/platform :ios, '14.0'/g" ios/App/Podfile
          cat ios/App/Podfile

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Simulator
        run: |
          cd ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ios/App/DerivedData/Build/Products/Release-iphonesimulator/App.app
