name: Build iOS App

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: |
          mkdir -p dist
          echo '<html><body style="background:#0A0A0F;color:#D4AF37;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif;"><h1>Throne Notes Loading...</h1></body></html>' > dist/index.html
          npm run build || true

      - name: Add iOS platform
        run: |
          rm -rf ios
          npx cap add ios || echo "Pod install failed - will fix and retry"

      - name: Fix iOS deployment target
        run: |
          perl -i -pe "s/platform :ios,\\s*['\"][\\d.]+['\"]/platform :ios, '15.0'/g" ios/App/Podfile
          echo "=== Fixed Podfile ==="
          cat ios/App/Podfile

      - name: Fix App deployment target
        run: |
          perl -i -pe 's/IPHONEOS_DEPLOYMENT_TARGET = 14\.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' ios/App/App.xcodeproj/project.pbxproj
          echo "=== Fixed project.pbxproj ==="
          grep -n "IPHONEOS_DEPLOYMENT_TARGET" ios/App/App.xcodeproj/project.pbxproj || true

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update

      - name: Copy assets to iOS
        run: npx cap copy ios

      - name: Build iOS Simulator
        run: |
          cd ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ios/App/DerivedData/Build/Products/Release-iphonesimulator/App.app
